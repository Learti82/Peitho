<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Peitho">
  <!-- Document body with rounded top-right corner -->
  <path d="M34 22 H82 a14 14 0 0 1 14 14 V98 a4 4 0 0 1 -4 4 H38 a4 4 0 0 1 -4 -4 Z" fill="#1e3a5f"/>

  <!-- Scroll curl (volute) at top-left -->
  <path d="M34 22 a16 16 0 1 0 16 16 a8 8 0 1 1 -8 -8" fill="none" stroke="#1e3a5f" stroke-width="6" stroke-linecap="round"/>

  <!-- Text lines on the document -->
  <rect x="52" y="40" width="30" height="5" rx="2.5" fill="#ffffff"/>
  <rect x="52" y="52" width="24" height="5" rx="2.5" fill="#ffffff"/>
  <rect x="52" y="64" width="18" height="5" rx="2.5" fill="#ffffff"/>

  <!-- Gold pen nib (bottom-right) -->
  <path d="M96 60 V99 a3 3 0 0 1 -3 3 H62 Z" fill="#c9a84c"/>
  <!-- Nib slit -->
  <rect x="78.5" y="74" width="3" height="20" rx="1.5" fill="#1e3a5f" transform="rotate(0 80 84)"/>
  <!-- Nib hole -->
  <circle cx="80" cy="78" r="3.5" fill="#1e3a5f"/>
</svg>
